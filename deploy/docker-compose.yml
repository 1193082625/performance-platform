name: performance-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-performance_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$$POSTGRES_USER"
          -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: performance-platform-server:local
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    command:
      - pnpm
      - --filter
      - '@performance-platform/server'
      - migrate
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-performance_platform}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  server:
    image: performance-platform-server:local
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: '3000'
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-performance_platform}
      APP_ID: ${APP_ID:-demo-web}
      CORS_ORIGINS: >-
        ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${SERVER_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  console:
    image: performance-platform-console:local
    build:
      context: ..
      dockerfile: apps/console/Dockerfile
    ports:
      - '${CONSOLE_PORT:-4173}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  demo-web:
    image: performance-platform-demo-web:local
    build:
      context: ..
      dockerfile: apps/demo-web/Dockerfile
      args:
        VITE_MONITOR_ENDPOINT: >-
          ${VITE_MONITOR_ENDPOINT:-http://localhost:3000/api/v2/events/batch}
        VITE_APP_ID: ${APP_ID:-demo-web}
        VITE_APP_VERSION: ${DEMO_APP_VERSION:-0.2.0+compose}
        VITE_APP_ENVIRONMENT: ${DEMO_APP_ENVIRONMENT:-development}
        VITE_MONITOR_SAMPLE_RATE: >-
          ${VITE_MONITOR_SAMPLE_RATE:-1}
    ports:
      - '${DEMO_PORT:-5173}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data: